name: Update bill tracker

on:
  schedule:
    # Times are UTC (Eastern is 4 hours behind in summer, 5 in winter). They avoid the top of the
    # hour, when GitHub's scheduler is busiest and starts runs hours late.
    - cron: "17 10 * * *"           # every day, early morning
    # During the session (January-June), hourly on weekdays from about 8 a.m. to 7 p.m., so committee
    # agendas, added bills and floor votes show up the same day.
    - cron: "17 12-23 * 1-6 1-5"
    # July-December, every two hours on weekdays, so bills the governor requests, signs or vetoes
    # show up the same day.
    - cron: "17 13-23/2 * 7-12 1-5"
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write           # to store a finished session's data in data/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.fresh.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sessions start in odd-numbered years and run two years (2025-26, 2027-28, ...).
      - name: Work out the current session
        run: |
          Y=$(TZ=America/New_York date +%Y)
          echo "CURRENT_SESSION=$(( Y % 2 == 0 ? Y - 1 : Y ))" >> "$GITHUB_ENV"

      # When a new session starts, download the one that just ended and commit it (gzipped).
      # Repeat daily through February 15, since the governor has 30 days for bills delivered in late December, and those actions
      # can reach the API late. After that, past sessions are never re-downloaded.
      - name: Store the previous session
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          PREV=$(( CURRENT_SESSION - 2 ))
          MD=$(TZ=America/New_York date +%m%d)
          if [ ! -f "data/bills_$PREV.json.gz" ] || [ "$MD" -le "0215" ]; then
            python3 fetch_bills.py "$PREV"
            gzip -9 -k -f -n "data/bills_$PREV.json"
            git add "data/bills_$PREV.json.gz"
            if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Store final data for the $PREV session"
              git push
            fi
          fi

      - name: Download current session from Open Legislation
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: python3 fetch_bills.py "$CURRENT_SESSION"

      # Bills prefiled for the next session (from mid-December) get their own page, <next>.html,
      # until it opens in January. They aren't committed; the file is downloaded fresh each run.
      - name: Download next session's prefiled bills
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          if [ $(( $(TZ=America/New_York date +%Y) % 2 )) -eq 0 ] && [ "$(TZ=America/New_York date +%-m)" -ge 11 ]; then
            python3 fetch_bills.py $(( CURRENT_SESSION + 2 )) || echo "Prefiled bills didn't download"
          fi

      # Senate and Assembly committee agendas: which bills each committee takes up, and when.
      - name: Download committee agendas
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          export PROBLEMS_FILE="$RUNNER_TEMP/problems.txt"
          if ! python3 fetch_agendas.py "$CURRENT_SESSION"; then
            echo "Agendas failed; building without them"
            # Agendas matter only while committees meet (January-June).
            if [ "$(TZ=America/New_York date +%-m)" -le 6 ]; then
              echo "Committee agendas didn't download." >> "$RUNNER_TEMP/problems.txt"
            fi
          fi

      # Assembly floor votes come from nyassembly.gov, one page per bill. Votes already
      # collected are kept in data/assembly_votes_<session>.json, so only new ones are fetched;
      # the updated file is committed back.
      - name: Collect new Assembly votes
        run: |
          python3 fetch_assembly_votes.py "$CURRENT_SESSION" || echo "Assembly votes failed; using the committed file"
          if [ -n "$(git status --porcelain data/assembly_votes_*.json)" ]; then
            git add data/assembly_votes_*.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update Assembly votes" && git push || echo "Couldn't save Assembly votes; they'll be refetched next run"
          fi

      # Committee chairs and members, and legislators' page links. If a source is down,
      # the committed data/contacts_<session>.json is used as is.
      - name: Refresh contacts
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          # Once a day is plenty; skip if today's refresh already ran.
          TODAY=$(TZ=America/New_York date +%F)
          if python3 -c "import json,sys; sys.exit(json.load(open('data/contacts_$CURRENT_SESSION.json')).get('fetched') != '$TODAY')" 2>/dev/null; then
            echo "Contacts already refreshed today"; exit 0
          fi
          python3 fetch_contacts.py "$CURRENT_SESSION" || echo "Contacts refresh failed; using the committed file"
          if [ -n "$(git status --porcelain data/contacts_*.json)" ]; then
            git add data/contacts_*.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update contacts" && git push || echo "Couldn't save contacts"
          fi

      - name: Build pages
        run: python3 build_data.py --github _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Anything behind (a download that keeps failing, Assembly votes not collected) is listed in
      # the run summary. The site still deploys; the "alert" job below then fails so GitHub emails.
      - name: Check the data is current
        id: fresh
        continue-on-error: true
        run: python3 check_fresh.py "$CURRENT_SESSION" "$RUNNER_TEMP/problems.txt"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: [build, deploy]
    if: needs.build.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Some of the site's data is behind. See the 'Check the data is current' step of the build job for details."
          exit 1
